version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: qa_pipeline_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: qa_pipeline
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    networks:
      - qa_pipeline_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d qa_pipeline"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # AI-Powered QA Review Pipeline Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qa_pipeline_app
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      # Database Configuration
      DATABASE_URL: postgresql://postgres:postgres@db:5432/qa_pipeline?schema=public
      
      # Application Configuration
      PORT: 3001
      NODE_ENV: production
      
      # AI Configuration (set these in .env file)
      API_KEY: ${OPENAI_API_KEY}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      
      # Security
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      
      # Git Configuration
      GIT_CONFIG_GLOBAL_USER_NAME: "QA Pipeline Bot"
      GIT_CONFIG_GLOBAL_USER_EMAIL: "qa-pipeline@example.com"
    volumes:
      - app_workspaces:/app/local-agent/workspaces
      - /var/run/docker.sock:/var/run/docker.sock:ro  # For Docker-in-Docker if needed
    networks:
      - qa_pipeline_network
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3001/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # pgAdmin (Database Management UI) - Optional for production
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: qa_pipeline_pgadmin
    restart: unless-stopped
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy
    networks:
      - qa_pipeline_network
    profiles:
      - admin  # Use 'docker-compose --profile admin up' to include pgAdmin

  # Nginx Reverse Proxy (Optional for production)
  nginx:
    image: nginx:alpine
    container_name: qa_pipeline_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    networks:
      - qa_pipeline_network
    profiles:
      - nginx  # Use 'docker-compose --profile nginx up' to include Nginx

volumes:
  postgres_data:
    driver: local
  app_workspaces:
    driver: local
  pgadmin_data:
    driver: local

networks:
  qa_pipeline_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16